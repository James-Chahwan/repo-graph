# repo-graph demo — recording-only kitty config (REVERSIBLE).
# Launch a fresh window with this; your ~/.config/kitty/kitty.conf is untouched:
#     kitty --config scripts/demo/recording.kitty.conf
# Close the window when done — nothing permanent changes.

font_family            Source Code Pro
font_size              17.0
modify_font            cell_height 118%
text_composition_strategy platform

# fixed 1920x1080 canvas — a terminal you can record / overlay as a background video
remember_window_size    no
initial_window_width    1920
initial_window_height   1080
hide_window_decorations yes
window_padding_width    16
window_margin_width     0
background_opacity      1.0
enable_audio_bell       no
cursor_shape            block
cursor_blink_interval   0
scrollback_lines        2000
shell                   zsh

# calm black + soft pastel / neon green (clean demo terminal)
background  #0a0a0a
foreground  #cfe6d2
selection_background #1e3a2a
selection_foreground #eef6ee
cursor      #8effc0
cursor_text_color #0a0a0a
color0  #141414
color8  #4a4a4a
color1  #e88a8a
color9  #f2a6a6
color2  #8effc0
color10 #a8ffd0
color3  #d8d39a
color11 #e8e3aa
color4  #9ecbe6
color12 #b8dcf0
color5  #aee0c2
color13 #c6eed6
color6  #9fe6cf
color14 #bdf0e0
color7  #cfe6d2
color15 #eef6ee
