# repo-graph demo — recording-only kitty config (REVERSIBLE).
# Launch a fresh window with this; your normal ~/.config/kitty/kitty.conf is untouched:
#     kitty --config scripts/demo/recording.kitty.conf
# Close the window when done — nothing permanent changes.

# legible-on-video type
font_family            Source Code Pro
font_size              18.0
modify_font            cell_height 120%
text_composition_strategy platform

# clean capture — open fullscreen so the tmux split gets the whole screen
start_as                fullscreen
hide_window_decorations yes
window_padding_width    14
window_margin_width     0
remember_window_size    no
initial_window_width    1680
initial_window_height   945
background_opacity      1.0
enable_audio_bell       no
cursor_shape            block
cursor_blink_interval   0
scrollback_lines        2000
shell                   zsh

# vaporwave palette (matches the icon)
background  #0d0a1a
foreground  #e8e8f2
selection_background #b967ff
selection_foreground #0d0a1a
cursor      #ff2d95
cursor_text_color #0d0a1a
color0  #1a1530
color8  #4a3f6a
color1  #ff2d95
color9  #ff71ce
color2  #05ffa1
color10 #39ff14
color3  #ffd166
color11 #ffe08a
color4  #01cdfe
color12 #5bc8ff
color5  #b967ff
color13 #d39bff
color6  #5bc8ff
color14 #a9ecff
color7  #e8e8f2
color15 #ffffff
