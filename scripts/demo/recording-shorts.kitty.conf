# Shorts/Reels variant — 1080x1920 portrait, panes stacked as rows.
# Inherits the calm black + pastel-green theme/font from the side-by-side config;
# only the canvas aspect changes. REVERSIBLE — used only for the recording window.
#     kitty --config scripts/demo/recording-shorts.kitty.conf
include recording.kitty.conf

# 9:16 portrait sized to FIT a 1440-tall screen. A native 1080x1920 window is
# taller than the screen, so the compositor clips it and the desktop bleeds in
# around the edges. 765x1360 is exact 9:16 and fits with margin for the GNOME
# top bar. Record THIS window, then scale up to 1080x1920 in post (see below /
# record.sh). The compositor honours a size that fits — same as the landscape one.
initial_window_width    765
initial_window_height   1360
window_padding_width    10

# Shorts text size. The 765px-wide capture only fits ~94 cols at this size, and
# it's upscaled ~1.4x to 1080x1920 in post — so a smaller capture font reads
# LARGER in the final video while leaving room so lines don't wrap/collide.
font_size               9.5
