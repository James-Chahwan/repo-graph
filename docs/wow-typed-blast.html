<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>repo-graph — typed impact</title>
<style>
  :root{--bg:#0a0a0a;--ink:#e8ffe8;--dim:#5a6b5a;--grn:#8effc0;--grn2:#3ad17a;
    --blue:#6aa9ff;--amber:#e0a92e;--pink:#ff86c8;--line:#26331f;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:var(--mono)}
  #stage{position:absolute;top:0;left:0;width:1080px;height:1920px;
    background:radial-gradient(120% 80% at 50% 0%,#0e150e 0%,var(--bg) 55%);transform-origin:top left;color:var(--ink);overflow:hidden}
  #mark{position:absolute;top:56px;left:0;right:0;text-align:center;color:var(--dim);font-size:27px;letter-spacing:.4em;text-transform:uppercase}
  #mark b{color:var(--grn)}
  #bar{position:absolute;left:0;bottom:0;height:8px;width:0;background:var(--grn);box-shadow:0 0 12px var(--grn)}
  .capbox{position:absolute;top:130px;left:0;right:0;height:200px;padding:0 70px}
  .cap{position:absolute;left:70px;right:70px;top:0;text-align:center;opacity:0;transition:opacity .5s}
  .cap h1{font-size:60px;line-height:1.12;font-weight:700} .cap h1 em{color:var(--grn);font-style:normal}
  .cap .sub{margin-top:14px;color:var(--dim);font-size:30px}
  body.p0 .c0,body.p1 .c1,body.p2 .c2{opacity:1}
  .term{position:absolute;top:340px;left:0;right:0;text-align:center;font-size:32px;color:var(--grn);font-weight:700;opacity:0;transition:opacity .5s}
  body.p1 .term,body.p2 .term{opacity:1} .term .d{color:var(--grn2)}

  svg{position:absolute;top:420px;left:0;width:1080px;height:1060px}
  .lane{fill:var(--dim);font-size:23px;letter-spacing:.16em;text-anchor:middle;opacity:0;transition:opacity .5s}
  body.p0 .lane,body.p1 .lane,body.p2 .lane{opacity:.55}
  .divider{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 8;opacity:0;transition:opacity .5s}
  body.p0 .divider,body.p1 .divider,body.p2 .divider{opacity:1}
  .seed circle{fill:#10301d;stroke:var(--grn);stroke-width:3;filter:drop-shadow(0 0 10px var(--grn));animation:throb 1.4s ease-in-out infinite}
  @keyframes throb{0%,100%{filter:drop-shadow(0 0 8px var(--grn))}50%{filter:drop-shadow(0 0 24px var(--grn))}}
  .seed text{fill:var(--ink);font-size:26px;font-weight:700;text-anchor:middle} .seed .k{fill:var(--dim);font-size:19px}
  .tedge{fill:none;stroke-width:5;opacity:0;stroke-dasharray:1;stroke-dashoffset:1}
  body.p1 .tedge,body.p2 .tedge{opacity:1;animation:draw .9s ease forwards;animation-delay:var(--d,0s)}
  @keyframes draw{to{stroke-dashoffset:0}}
  .http{stroke:var(--blue);filter:drop-shadow(0 0 6px var(--blue))}
  .queue{stroke:var(--amber);filter:drop-shadow(0 0 6px var(--amber))}
  .gql{stroke:var(--pink);filter:drop-shadow(0 0 6px var(--pink))}
  .dn{opacity:0} body.p1 .dn,body.p2 .dn{opacity:1;transition:opacity .4s;transition-delay:var(--d,0s)}
  .dn text{fill:var(--ink);font-size:23px;text-anchor:middle}
  .dn.http circle{fill:#0d1626;stroke:var(--blue);stroke-width:2.5}
  .dn.queue circle{fill:#1a1407;stroke:var(--amber);stroke-width:2.5}
  .dn.gql circle{fill:#23121c;stroke:var(--pink);stroke-width:2.5}

  .ledger{position:absolute;top:1520px;left:160px;right:160px;opacity:0;transition:opacity .5s}
  body.p2 .ledger{opacity:1}
  .lr{display:flex;justify-content:space-between;font-size:30px;font-weight:700;padding:14px 24px;border-radius:12px;margin-bottom:14px;border:1px solid}
  .lr.http{color:var(--blue);border-color:#23405e}
  .lr.queue{color:var(--amber);border-color:#4a3c14}
  .lr.gql{color:var(--pink);border-color:#4a2238}
  .stat{position:absolute;left:0;right:0;bottom:108px;text-align:center;font-size:34px;opacity:0;transition:opacity .5s}
  body.p2 .stat{opacity:1} .stat b{color:var(--grn);font-weight:800}
</style></head>
<body class="p0"><div id="stage">
  <div id="mark"><b>repo-graph</b> · typed impact</div>
  <div class="capbox">
    <div class="cap c0"><h1>rename <em>one</em> field</h1><div class="sub">User.email — a shared type</div></div>
    <div class="cap c1"><h1>it knows <em>how</em><br>things connect</h1><div class="sub">not just THAT they do</div></div>
    <div class="cap c2"><h1>one field.<br><em>three stacks.</em></h1></div>
  </div>
  <div class="term"><span class="d">$</span> repo-graph impact User.email</div>
  <svg viewBox="0 0 1080 1060" id="g">
    <line class="divider" x1="360" y1="320" x2="360" y2="1040"/>
    <line class="divider" x1="720" y1="320" x2="720" y2="1040"/>
    <text class="lane" x="185" y="300">HTTP</text>
    <text class="lane" x="540" y="300">QUEUE</text>
    <text class="lane" x="895" y="300">GRAPHQL</text>

    <path class="tedge http"  style="--d:.0s"  pathLength="1" d="M540,100 C420,260 300,420 230,560"/>
    <path class="tedge queue" style="--d:.25s" pathLength="1" d="M540,130 L540,560"/>
    <path class="tedge gql"   style="--d:.5s"  pathLength="1" d="M540,100 C660,260 780,420 850,560"/>

    <g class="seed"><circle cx="540" cy="80" r="56"/><text x="540" y="74">User.email</text><text class="k" x="540" y="102">shared type</text></g>

    <g class="dn http"  style="--d:.6s"><circle cx="230" cy="600" r="46"/><text x="230" y="606">GET /users</text></g>
    <g class="dn http"  style="--d:.75s"><circle cx="230" cy="740" r="46"/><text x="230" y="746">profile.tsx</text></g>
    <line class="tedge http" style="--d:.7s" pathLength="1" x1="230" y1="646" x2="230" y2="694"/>
    <g class="dn queue" style="--d:.85s"><circle cx="540" cy="660" r="48"/><text x="540" y="666">email-worker</text></g>
    <g class="dn queue" style="--d:1.0s"><circle cx="540" cy="800" r="48"/><text x="540" y="806">welcome.job</text></g>
    <line class="tedge queue" style="--d:.95s" pathLength="1" x1="540" y1="708" x2="540" y2="752"/>
    <g class="dn gql"   style="--d:1.1s"><circle cx="850" cy="600" r="46"/><text x="850" y="606">UserType</text></g>
    <g class="dn gql"   style="--d:1.25s"><circle cx="850" cy="740" r="46"/><text x="850" y="746">resolvers.ts</text></g>
    <line class="tedge gql" style="--d:1.2s" pathLength="1" x1="850" y1="646" x2="850" y2="694"/>
  </svg>
  <div class="ledger">
    <div class="lr http"><span>HTTP</span><span>4 affected</span></div>
    <div class="lr queue"><span>QUEUE</span><span>3 affected</span></div>
    <div class="lr gql"><span>GraphQL</span><span>4 affected</span></div>
  </div>
  <div class="stat"><b>3</b> transports · <b>11</b> affected · <b>2</b> services</div>
  <div id="bar"></div>
</div>
<script>
  const stage=document.getElementById('stage'),bar=document.getElementById('bar');
  function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);
    stage.style.transform=`translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`;}
  addEventListener('resize',fit);fit();
  const TOTAL=12500,cues=[[0,'p0'],[3000,'p1'],[8500,'p2']];
  const ph=new URLSearchParams(location.search).get('phase');
  if(ph){document.body.className=ph;}
  else{let st=null;(function f(ts){if(st===null)st=ts;const t=(ts-st)%TOTAL;let c='p0';for(const[a,k]of cues)if(t>=a)c=k;
    if(!document.body.classList.contains(c))document.body.className=c;bar.style.width=(t/TOTAL*1080)+'px';requestAnimationFrame(f);})(0);}
</script></body></html>
