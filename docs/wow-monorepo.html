<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repo-graph — monorepo, one graph</title>
<style>
  :root{--bg:#0a0a0a;--ink:#e8ffe8;--dim:#5a6b5a;--grn:#8effc0;--grn2:#3ad17a;--blue:#6aa9ff;
    --gold:#c9a227;--line:#26331f;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:var(--mono)}
  #stage{position:absolute;top:0;left:0;width:1080px;height:1920px;
    background:radial-gradient(120% 80% at 50% 0%,#0e150e 0%,var(--bg) 55%);
    transform-origin:top left;color:var(--ink);overflow:hidden}
  #mark{position:absolute;top:60px;left:0;right:0;text-align:center;color:var(--dim);font-size:28px;letter-spacing:.42em;text-transform:uppercase}
  #mark b{color:var(--grn)}
  #bar{position:absolute;left:0;bottom:0;height:8px;width:0;background:var(--grn);box-shadow:0 0 12px var(--grn)}
  .capbox{position:absolute;top:150px;left:0;right:0;height:280px;padding:0 80px}
  .cap{position:absolute;left:80px;right:80px;top:0;text-align:center;opacity:0;transition:opacity .5s}
  .cap h1{font-size:72px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
  .cap h1 em{color:var(--grn);font-style:normal}
  .cap .sub{margin-top:20px;color:var(--dim);font-size:32px}
  body.p0 .c0,body.p1 .c1,body.p2 .c2{opacity:1}

  svg{position:absolute;top:430px;left:30px;width:1020px;height:1420px}
  .island rect{fill:rgba(20,30,20,.5);stroke:var(--line);stroke-width:2;stroke-dasharray:8 7;rx:22}
  .island .lbl{fill:var(--ink);font-size:30px;font-weight:700}
  .island .tech{fill:var(--dim);font-size:24px}
  .nd{fill:#0d140d;stroke:var(--grn2);stroke-width:2.5}
  .island.fe .nd{stroke:var(--blue)} .island.data .nd{stroke:var(--gold)}

  /* cross-stack links draw on at p1 (pathLength=1 normalises the draw) */
  .link{fill:none;stroke:var(--grn);stroke-width:5;opacity:0;stroke-dasharray:1;stroke-dashoffset:1;
    filter:drop-shadow(0 0 7px var(--grn))}
  body.p1 .link,body.p2 .link{opacity:1;animation:draw .7s ease forwards;animation-delay:var(--d,0s)}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .link.http{stroke:var(--blue);filter:drop-shadow(0 0 7px var(--blue))}
  .linklab{fill:var(--grn);font-size:24px;text-anchor:middle;opacity:0;transition:opacity .4s .5s}
  .linklab.http{fill:var(--blue)}
  body.p1 .linklab,body.p2 .linklab{opacity:.9}

  .stat{position:absolute;left:0;right:0;bottom:120px;text-align:center;opacity:0;transition:opacity .5s;
    font-size:40px;color:var(--ink)}
  body.p2 .stat{opacity:1}
  .stat b{color:var(--grn);font-weight:800}
</style>
</head>
<body class="p0">
<div id="stage">
  <div id="mark"><b>repo-graph</b> · the monorepo problem</div>
  <div class="capbox">
    <div class="cap c0"><h1>Four apps.<br>Four folders.</h1><div class="sub">…and no idea how they connect</div></div>
    <div class="cap c1"><h1>one <em>graph</em></h1><div class="sub">cross-stack resolvers link the islands</div></div>
    <div class="cap c2"><h1>grep stops at the<br>folder boundary.</h1><div class="sub"><em>repo-graph doesn't.</em></div></div>
  </div>

  <svg viewBox="0 0 1020 1420">
    <!-- cross-stack links (under the islands) -->
    <path class="link http" style="--d:.0s"  pathLength="1" d="M300,300 C340,420 440,470 470,560"></path>
    <path class="link http" style="--d:.25s" pathLength="1" d="M770,360 C700,460 600,500 560,560"></path>
    <path class="link"      style="--d:.5s"  pathLength="1" d="M470,820 C420,920 360,960 320,1020"></path>
    <path class="link"      style="--d:.7s"  pathLength="1" d="M250,300 C180,560 200,820 250,1020"></path>
    <text class="linklab http" x="300" y="445">HTTP</text>
    <text class="linklab http" x="700" y="495">HTTP</text>
    <text class="linklab" x="370" y="945">schema</text>
    <text class="linklab" x="150" y="660">imports</text>

    <!-- islands -->
    <g class="island fe">
      <rect x="80" y="60" width="360" height="240" rx="22"/>
      <text class="lbl" x="108" y="110">web/</text><text class="tech" x="108" y="146">Angular</text>
      <circle class="nd" r="22" cx="150" cy="220"/><circle class="nd" r="22" cx="230" cy="240"/>
      <circle class="nd" r="22" cx="320" cy="210"/><circle class="nd" r="22" cx="380" cy="250"/>
    </g>
    <g class="island">
      <rect x="600" y="120" width="350" height="230" rx="22"/>
      <text class="lbl" x="628" y="170">mobile/</text><text class="tech" x="628" y="206">Flutter</text>
      <circle class="nd" r="22" cx="680" cy="290"/><circle class="nd" r="22" cx="760" cy="270"/>
      <circle class="nd" r="22" cx="850" cy="300"/>
    </g>
    <g class="island">
      <rect x="300" y="560" width="440" height="260" rx="22"/>
      <text class="lbl" x="330" y="612">backend/</text><text class="tech" x="330" y="648">Go</text>
      <circle class="nd" r="24" cx="400" cy="740"/><circle class="nd" r="24" cx="490" cy="760"/>
      <circle class="nd" r="24" cx="590" cy="730"/><circle class="nd" r="24" cx="670" cy="760"/>
    </g>
    <g class="island data">
      <rect x="120" y="1020" width="380" height="240" rx="22"/>
      <text class="lbl" x="150" y="1072">shared/</text><text class="tech" x="150" y="1108">types · schema</text>
      <circle class="nd" r="22" cx="200" cy="1180"/><circle class="nd" r="22" cx="290" cy="1200"/>
      <circle class="nd" r="22" cx="390" cy="1180"/>
    </g>
  </svg>

  <div class="stat"><b>53</b> cross-stack links · <b>4</b> apps · <b>1</b> graph</div>
  <div id="bar"></div>
</div>
<script>
  const stage=document.getElementById('stage'),bar=document.getElementById('bar');
  function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);
    stage.style.transform=`translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`;}
  addEventListener('resize',fit);fit();
  const TOTAL=12000,cues=[[0,'p0'],[4000,'p1'],[8500,'p2']];
  const ph=new URLSearchParams(location.search).get('phase');
  if(ph){document.body.className=ph;}
  else{let st=null;(function f(ts){if(st===null)st=ts;const t=(ts-st)%TOTAL;
    let c='p0';for(const[a,k]of cues)if(t>=a)c=k;if(!document.body.classList.contains(c))document.body.className=c;
    bar.style.width=(t/TOTAL*1080)+'px';requestAnimationFrame(f);})(0);}
</script>
</body>
</html>
