[project]
name = "mcp-repo-graph"
version = "0.5.1"
description = "MCP server that gives LLMs a structural map of any codebase — entities, relationships, and flows — so they navigate to the right files without reading everything first."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "James Chahwan"},
]
keywords = ["mcp", "llm", "codebase", "graph", "navigation", "context", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Majors are capped on purpose. An uncapped `mcp>=1` let 2.0 in and broke
    # every fresh install for two months (2026-07-28 to 2026-09-15), because a
    # published package resolves its deps fresh on the user's machine. A cap
    # turns that into an install-time refusal we can see, instead of a runtime
    # crash the user sees. Lift each one deliberately, with the port done.
    "mcp[cli]>=2,<3",       # 2.x renamed FastMCP -> MCPServer; ported in 0.5.1
    "glia-py>=0.5.0,<0.6",  # engine API is versioned with the graph format
    "watchdog>=3.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/James-Chahwan/repo-graph"
Repository = "https://github.com/James-Chahwan/repo-graph"
Issues = "https://github.com/James-Chahwan/repo-graph/issues"

[project.scripts]
# `mcp-repo-graph` mirrors the PyPI package name so `uvx mcp-repo-graph` and
# marketplace one-click installs (VS Code, Cursor, Claude registry) resolve a
# launchable command. `repo-graph` is the historical name kept for existing
# .mcp.json configs.
mcp-repo-graph = "repo_graph.server:main"
repo-graph = "repo_graph.server:main"
repo-graph-init = "repo_graph.init:main"

[tool.setuptools.packages.find]
include = ["repo_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "perf: performance regression gates (opt-in via -m perf)",
    "e2e: end-to-end MCP protocol tests (spawn server subprocess)",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
