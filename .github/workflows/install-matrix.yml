name: install-matrix

# Fresh-machine validation, two ways:
#   source    — clean-room image installs this checkout (latest-resolving deps), runs
#               `repo-graph install` for all 9 agents, then talks real MCP over stdio
#               to the installed server (handshake + tools/list + orient), uninstalls.
#   published — `uvx mcp-repo-graph` from PyPI on a clean Debian box, real MCP handshake.
# Scheduled daily: deps release without us pushing (mcp 2.0 broke every fresh install
# on 2026-07-28 and nothing ran for two months). A red here means users can't install.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build clean-room image
        run: docker build -f docker/Dockerfile -t repo-graph-install-matrix .
      - name: Run install matrix
        run: docker run --rm repo-graph-install-matrix

  # Early warning for the next breaking upstream major. The cap in pyproject
  # protects users; this job tells us the cap is now the only thing doing so.
  # `mcp[cli]<2` sat there for two months because nothing was watching 2.x.
  unpinned-upstream:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true      # advisory: a red here is a heads-up, not a broken build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install with every cap lifted, then run the suite
        run: |
          python -m pip install -q -e ".[dev]"
          # deliberately drag each dependency to its newest release, caps ignored
          python -m pip install -q -U --upgrade-strategy eager "mcp[cli]" glia-py watchdog
          python - <<'PY'
          import importlib.metadata as m
          for pkg in ("mcp", "glia-py", "watchdog"):
              print(f"::notice::unpinned {pkg} == {m.version(pkg)}")
          PY
          pytest -q -m "not perf"

  published:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Install uv (documented path) + python for the harness
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates git python3 >/dev/null
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: uvx mcp-repo-graph from PyPI — MCP handshake
        run: python3 docker/install_matrix.py --published
