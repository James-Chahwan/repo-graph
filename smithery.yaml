# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
#
# repo-graph is a LOCAL stdio MCP server — it maps the user's own codebase, so it
# runs on their machine via uvx (not a hosted HTTPS endpoint). This declares the
# stdio start command for Smithery's local-server distribution.

startCommand:
  type: stdio
  configSchema:
    # Configuration options surfaced to the user when they install via Smithery.
    type: object
    properties:
      repo:
        type: string
        description: >-
          Path to the repository to map, or a git URL to clone and map.
          Defaults to the current directory.
        default: "."
  commandFunction:
    # Produces the CLI command Smithery launches on stdio.
    |-
    (config) => ({
      command: 'uvx',
      args: ['mcp-repo-graph', '--repo', config.repo || '.']
    })
